<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="328.1 62.56 743.8 306.88">
  <defs>
    <style>
      .word { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif; font-weight: 950; letter-spacing: -18px; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif; font-weight: 800; letter-spacing: 4px; }
      .stroke { fill: none; stroke: #fff; stroke-width: 46; stroke-linecap: round; stroke-linejoin: round; }
      /* keep the inner trace visible on a white outer stroke */
      .strokeInner { fill: none; stroke: rgba(0,0,0,0.70); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Tight-cropped white variant for dark backgrounds (same artwork as qgg-lockup-b-labeled-tight.svg) -->
  <g transform="translate(346,60)">
    <text x="0" y="245" class="word" font-size="260" fill="#fff">q</text>

    <g transform="translate(186.5,128)">
      <!-- base infinity with small center-gap -->
      <path class="stroke" d="M 54 86 C 36 56, 0 58, 0 86 C 0 114, 36 116, 54 86" />
      <path class="stroke" d="M 86 86 C 104 56, 140 58, 140 86 C 140 114, 104 116, 86 86" />
      <path class="stroke" d="M 42 104 C 54 96, 60 92, 62 90" opacity="0.98" />
      <path class="stroke" d="M 78 80 C 84 76, 92 72, 98 68" opacity="0.98" />

      <!-- inner trace -->
      <path class="strokeInner" d="M 70 86 C 40 48, 0 55, 0 86 C 0 118, 40 124, 70 86 C 100 48, 140 55, 140 86 C 140 118, 100 124, 70 86" />
      <path class="strokeInner" d="M 42 104 C 62 92, 78 84, 98 68" opacity="0.98" />
    </g>

    <text x="340" y="245" class="word" font-size="260" fill="#fff">GG</text>

    <!-- labels centered above the respective letters -->
    <text x="105" y="40" class="label" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.86)">"Quantum"</text>
    <text x="437" y="40" class="label" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.86)">"Global"</text>
    <text x="616" y="40" class="label" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.86)">"Group"</text>
  </g>
</svg>

